name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test the core and compiler
        run: ./gradlew --no-daemon :core:test :compiler:jar

  # the action itself, as another repository uses it, on a test pack
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
        with:
          pack: testpacks/hello

      - name: Check the overlays were written
        run: |
          test -f testpacks/hello/assets/minecraft/shaders/core/rendertype_armor_cutout_no_cull.vsh
          ls -d testpacks/hello/stitch_armor_*
          grep -q stitch_armor_ testpacks/hello/pack.mcmeta
